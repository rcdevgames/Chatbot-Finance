version: '3.8'

services:
  app:
    build: .
    container_name: chatbot
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=${PORT:-8080}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-Asia/Jakarta}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-id}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-70b-versatile}
      - GROQ_TEMPERATURE=${GROQ_TEMPERATURE:-0.3}
      - GROQ_MAX_TOKENS=${GROQ_MAX_TOKENS:-1000}
    ports:
      - "${PORT:-8080}:8080"
    networks:
      - waw_bridge
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: chatbot-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-chatbot}
      - POSTGRES_USER=${POSTGRES_USER:-chatbot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - waw_bridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatbot} -d ${POSTGRES_DB:-chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  waw_bridge:
    external: true